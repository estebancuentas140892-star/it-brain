# IT Brain — configuración de Supabase CLI (para `supabase start` / `supabase test db`)
# Si una versión de la CLI reporta incompatibilidad con este archivo, regenéralo con
# `supabase init` y vuelve a colocar migrations/ y tests/ dentro de supabase/.

project_id = "it-brain"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Custom Access Token Hook (T-017, migración 0011): inyecta `active_org_id` +
# `active_role` en el JWT desde la membresía activa, para resolver la org sin el
# problema de bootstrap (docs 04 §2.2).
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[analytics]
enabled = false
