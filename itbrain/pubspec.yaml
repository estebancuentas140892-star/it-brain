name: itbrain
description: "IT Brain — Second Brain for IT Departments. Knowledge graph-based system for capturing and organizing technical knowledge."
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Authentication & Backend
  supabase_flutter: ^2.5.0
  supabase: ^2.1.0

  # State management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  riverpod_generator: ^2.3.0

  # Serialization & Code generation
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0

  # UI & Navigation
  go_router: ^13.0.0
  flutter_adaptive_scaffold: ^0.1.7

  # Forms & Validation
  formz: ^0.5.0

  # Utils & Helpers
  intl: ^0.19.0
  dio: ^5.3.0
  uuid: ^4.0.0
  connectivity_plus: ^5.0.0

  # Local Storage
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.0

  # Logging & Debugging
  logger: ^2.1.0
  fimber: ^0.6.0

  # Time
  timezone: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  riverpod_generator: ^2.3.0
  drift_dev: ^2.14.0

  # Linting & Analysis
  flutter_lints: ^3.0.0
  very_good_analysis: ^5.1.0

flutter:
  uses-material-design: true

  # Fonts (will add custom fonts later if needed)
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
  #       - asset: assets/fonts/CustomFont-Bold.ttf
  #         weight: 700
